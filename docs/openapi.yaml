  /schedule/export:
    get:
      operationId: exportSchedule
      tags:
      - downloads
      summary: Download a filtered two-sheet schedule workbook
      description: Authenticated members get published schedule only; administrators get the current schedule, including unpublished
        exams. Same schedule filters; page/page_size are rejected. A single SQL snapshot supplies Calendar and List sheets,
        without pagination truncation. Maximum 10,000 exams, 32 MiB source JSON, and 32,767 UTF-16 code units per cell; exceeding
        a limit returns 413. Values are literal inline strings, including formula-looking names.
      security:
      - OAuth2:
        - openid
      parameters:
      - name: date_from
        in: query
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        schema:
          type: string
          format: date
      - name: course_id
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: department_id
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: term
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 8
      - name: q
        in: query
        description: Case-insensitive literal substring of course code/name, up to 100 UTF-8 bytes.
        schema:
          type: string
          minLength: 1
          maxLength: 100
      responses:
        '200':
          description: Completed XLSX workbook. Dates/times use Europe/Istanbul.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Disposition:
              schema:
                type: string
            Vary:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '413':
          description: Narrow the export filters to fit resource limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /backups:
    post:
      operationId: downloadBackup
      tags:
      - downloads
      summary: Download a completed application database archive
      description: Administrator with verified MFA. No request body, query, path, or command arguments. Server uses its configured
        application database and a host PostgreSQL 18 client, never the Docker socket. A custom pg_dump archive must finish
        within 45 seconds and 256 MiB before delivery. One backup/download at a time; temporary files are private and cleaned
        on completion/disconnect. Includes all application data, migration/seed markers and database grants, but no cluster
        passwords or Keycloak database/credentials. This is a sensitive private download; restore only through the documented
        isolated operator procedure.
      security:
      - OAuth2:
        - openid
      responses:
        '200':
          description: Completed PostgreSQL custom archive, application.dump.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Disposition:
              schema:
                type: string
            Vary:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '429':
          description: 'Another backup stream is active. Retry-After: 5.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Missing/incompatible PostgreSQL client, invalid backup configuration, timeout, size limit, or dump
            failure. No partial archive is delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: Authorization Code with PKCE S256 through Keycloak. API permissions come from verified role/method claims
        and local ownership, not client-supplied roles.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8081/realms/exams/protocol/openid-connect/auth
          tokenUrl: http://localhost:8081/realms/exams/protocol/openid-connect/token
          scopes:
            openid: Authenticate with the configured identity provider.
  responses:
    BadRequest:
      description: Invalid query, JSON, field type, required field, or value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role, local identity, ownership mutation, or MFA is forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource missing or concealed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Unique, referenced-delete, lifecycle, or scheduling conflict; no partial writes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected sanitized error with a request ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAcceptable:
      description: The Accept header excludes every supported representation; negotiation happens before a write. Errors remain
        JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Only UTF-8 application/json input is supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
