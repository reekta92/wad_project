        and local ownership, not client-supplied roles.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8081/realms/exams/protocol/openid-connect/auth
          tokenUrl: http://localhost:8081/realms/exams/protocol/openid-connect/token
          scopes:
            openid: Authenticate with the configured identity provider.
  responses:
    BadRequest:
      description: Invalid query, JSON, field type, required field, or value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role, local identity, ownership mutation, or MFA is forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource missing or concealed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Unique, referenced-delete, lifecycle, or scheduling conflict; no partial writes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected sanitized error with a request ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAcceptable:
      description: The requested representation excludes JSON; negotiation happens before a write.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
