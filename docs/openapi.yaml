openapi: 3.1.0
info:
  title: Faculty Exams API
  version: 0.2.0
  description: Public schedule and verified identity API. Protected scheduling and CRUD operations are under development.
servers:
  - url: http://localhost:8080/api/v1
security: []
paths:
  /auth/config:
    get:
      operationId: getBrowserAuthenticationConfiguration
      summary: Get public Keycloak browser-client configuration
      responses:
        '200':
          description: Public issuer, server, realm, and client ID. No credentials or tokens are returned.
          content:
            application/json:
              schema:
                type: object
                required: [issuer, url, realm, client_id]
                properties:
                  issuer: { type: string, format: uri }
                  url: { type: string, format: uri }
                  realm: { type: string }
                  client_id: { const: exam-web }
  /me:
    get:
      operationId: getCurrentProfile
      summary: Get the active local profile for a verified access token
      description: Administrator tokens additionally require a signed passkey authentication reference, or both password and OTP references. Local inactive/unlinked accounts are rejected.
      security:
        - OAuth2: [openid]
      responses:
        '200':
          description: The caller's own profile and trusted permissions.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [id, username, role, permissions, personnel_id]
                properties:
                  id: { type: integer, format: int64 }
                  username: { type: string }
                  role: { type: string, enum: [member, administrator] }
                  permissions:
                    type: array
                    items: { type: string, enum: [invigilator] }
                  personnel_id: { type: [integer, 'null'], format: int64 }
        '401':
          description: Missing, invalid, expired, wrong-audience, or otherwise untrusted access token.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Missing application role, local account/personnel mapping, active status, or required administrator MFA proof.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Local identity data is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /health/live:
    get:
      operationId: getLiveness
      summary: Check process liveness
      responses:
        '200':
          description: Process is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check database and identity-provider readiness
      responses:
        '200':
          description: Both dependencies are ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: At least one dependency is unavailable. No connection credentials are returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /schedule:
    get:
      operationId: listPublishedSchedule
      summary: List published exams with their course, department, session, and rooms
      description: Unknown, empty, malformed, or repeated parameters return 400. Unpublished schedules return an empty page. Only JSON is currently supported.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 2147483647, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: course_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: department_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: term
          in: query
          schema: { type: integer, minimum: 1, maximum: 8 }
        - name: q
          in: query
          description: Case-insensitive literal substring of course code/name, up to 100 UTF-8 bytes.
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Correctly filtered page; ordering is date, start time, then exam ID.
          headers:
            Vary:
              schema: { type: string, const: Accept }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '406':
          description: Requested representation is unsupported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Schedule data could not be read; the response does not expose database errors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: Authorization Code with PKCE S256 through Keycloak. API permissions come from verified role/method claims and local ownership, not client-supplied roles.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8081/realms/exams/protocol/openid-connect/auth
          tokenUrl: http://localhost:8081/realms/exams/protocol/openid-connect/token
          scopes:
            openid: Authenticate with the configured identity provider.
  responses:
    BadRequest:
      description: Invalid filters or pagination.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          required: [database, identity]
          properties:
            database: { type: string, enum: [ok, unavailable] }
            identity: { type: string, enum: [ok, unavailable] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
    Room:
      type: object
      required: [id, name, floor]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        floor: { type: integer }
    ScheduleExam:
      type: object
      required: [id, course_id, course_code, course_name, term, department_id, department, session_id, date, start_time, end_time, rooms]
      properties:
        id: { type: integer, format: int64 }
        course_id: { type: integer, format: int64 }
        course_code: { type: string }
        course_name: { type: string }
        term: { type: integer, minimum: 1, maximum: 8 }
        department_id: { type: integer, format: int64 }
        department: { type: string }
        session_id: { type: integer, format: int64 }
        date: { type: string, format: date }
        start_time: { type: string, pattern: '^\d{2}:\d{2}:\d{2}$' }
        end_time: { type: string, pattern: '^\d{2}:\d{2}:\d{2}$' }
        rooms:
          type: array
          items: { $ref: '#/components/schemas/Room' }
    SchedulePage:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ScheduleExam' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
