name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - name: Verify module metadata
        working-directory: backend
        run: |
          go mod download
          go mod tidy -diff
      - name: Check formatting and Go diagnostics
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Check environment setup
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/setup.py
          docker compose config --quiet
      - name: Start isolated PostgreSQL and identity provider
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('infrastructure/exams-realm.json')
          realm = json.loads(path.read_text())
          for key in ['browserFlow', 'authenticationFlows', 'authenticatorConfig', 'requiredActions']:
              realm.pop(key, None)
          realm['clients'] = realm['clients'][:1]
          realm['clients'][0]['protocolMappers'] = [m for m in realm['clients'][0]['protocolMappers'] if m['protocolMapper'] != 'oidc-amr-mapper']
          path.write_text(json.dumps(realm))
          PY
          docker compose up -d --wait --wait-timeout 240
          git restore infrastructure/exams-realm.json
      - name: Run unit and database integration tests
        env:
          RUN_DATABASE_TESTS: '1'
        run: python3 scripts/run.py test
      - name: Build server and database commands
        working-directory: backend
        run: go build ./cmd/...
      - name: Provision local identities and verify safe repetition
        run: |
          python3 scripts/run.py migrate
          python3 scripts/run.py seed
          python3 scripts/run.py provision
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('.local/demo-accounts.json')
          original = path.read_bytes()
          subprocess.run(['python3', 'scripts/run.py', 'provision'], check=True)
          assert path.read_bytes() == original, 'Repeat provisioning changed private account state'
          PY
      - name: Stop test services
        if: always() && hashFiles('.env') != ''
        run: docker compose down

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare browser and frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx --no-install playwright install --with-deps chromium
      - name: Prepare isolated identity and database services
        run: |
          python3 scripts/setup.py
          docker compose up -d --wait --wait-timeout 240
          python3 scripts/run.py migrate
          python3 scripts/run.py seed
          python3 scripts/run.py provision
      - name: Verify responsive design, actual browser login and MFA
        working-directory: frontend
        run: npm run test:browser
      - name: Save public layout previews
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: public-layout-previews
          path: frontend/test-results/**/guest-*.jpg
          retention-days: 7
      - name: Stop browser test services
        if: always() && hashFiles('.env') != ''
        run: docker compose down

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Test API client and build application
        working-directory: frontend
        run: |
          npm test
          npm run build
