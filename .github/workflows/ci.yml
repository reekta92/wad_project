name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - name: Verify module metadata
        working-directory: backend
        run: |
          go mod download
          go mod tidy -diff
      - name: Check formatting and Go diagnostics
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Check environment setup
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/setup.py
          docker compose config --quiet
      - name: Start isolated PostgreSQL and identity provider
        run: docker compose up -d --wait --wait-timeout 240
      - name: Run unit and database integration tests
        env:
          RUN_DATABASE_TESTS: '1'
        run: python3 scripts/run.py test
      - name: Build server and database commands
        working-directory: backend
        run: go build ./cmd/...
      - name: Provision local identities and verify safe repetition
        run: |
          python3 scripts/run.py migrate
          python3 scripts/run.py seed
          python3 scripts/run.py provision
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('.local/demo-accounts.json')
          original = path.read_bytes()
          subprocess.run(['python3', 'scripts/run.py', 'provision'], check=True)
          assert path.read_bytes() == original, 'Repeat provisioning changed private account state'
          PY
      - name: Stop test services
        if: always() && hashFiles('.env') != ''
        run: docker compose down

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bootstrap authentication dependency lock metadata
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const packages = Object.fromEntries(Object.entries(lock.packages).filter(([key]) => /node_modules\/(keycloak-js|@playwright\/test|playwright|playwright-core)$/.test(key)));
          const encoded = Buffer.from(JSON.stringify({ root: lock.packages[''], packages })).toString('base64');
          for (let i = 0; i < encoded.length; i += 4096) console.log('WAD_AUTH_LOCK_METADATA=' + encoded.slice(i, i + 4096));
          JS
          npm ci --no-audit --no-fund
      - name: Test API client and build application
        working-directory: frontend
        run: |
          npm test
          npm run build
