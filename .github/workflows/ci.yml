name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - name: Verify module metadata
        working-directory: backend
        run: |
          go mod download
          go mod tidy -diff
      - name: Check formatting and Go diagnostics
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Check environment setup
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/setup.py
          docker compose config --quiet
      - name: Start isolated PostgreSQL and identity provider
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('infrastructure/exams-realm.json')
          realm = json.loads(path.read_text())
          for key in ['browserFlow', 'authenticationFlows', 'authenticatorConfig', 'requiredActions']:
              realm.pop(key, None)
          realm['clients'] = realm['clients'][:1]
          realm['clients'][0]['protocolMappers'] = [m for m in realm['clients'][0]['protocolMappers'] if m['protocolMapper'] != 'oidc-amr-mapper']
          path.write_text(json.dumps(realm))
          PY
          docker compose up -d --wait --wait-timeout 240
          git restore infrastructure/exams-realm.json
      - name: Run unit and database integration tests
        env:
          RUN_DATABASE_TESTS: '1'
        run: python3 scripts/run.py test
      - name: Build server and database commands
        working-directory: backend
        run: go build ./cmd/...
      - name: Provision local identities and verify safe repetition
        run: |
          python3 scripts/run.py migrate
          python3 scripts/run.py seed
          python3 scripts/run.py provision
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('.local/demo-accounts.json')
          original = path.read_bytes()
          subprocess.run(['python3', 'scripts/run.py', 'provision'], check=True)
          assert path.read_bytes() == original, 'Repeat provisioning changed private account state'
          PY
      - name: Stop test services
        if: always() && hashFiles('.env') != ''
        run: docker compose down

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare browser and frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx --no-install playwright install --with-deps chromium
      - name: Install PostgreSQL 18 client for application backups
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
      - name: Prepare isolated identity and database services
        run: |
          python3 scripts/setup.py
          docker compose up -d --wait --wait-timeout 240
          python3 scripts/run.py migrate
          python3 scripts/run.py seed
          python3 scripts/run.py provision
      - name: Verify responsive design, actual browser login and MFA
        working-directory: frontend
        run: npm run test:browser
      - name: Save public layout previews
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: public-layout-previews
          path: frontend/test-results/**/guest-*.jpg
          retention-days: 7
      - name: Save token-free collection evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: collection-evidence
          path: .local/collection-evidence/summary.json
          include-hidden-files: true
          retention-days: 30
      - name: Stop browser test services
        if: always() && hashFiles('.env') != ''
        run: docker compose down

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve current verification tool versions (bootstrap)
        working-directory: frontend
        run: |
          npm pkg set 'overrides.handlebars=4.7.10' 'overrides.lodash=4.18.1' 'overrides.flatted=3.4.2' 'overrides.qs=6.16.0' 'overrides.underscore=1.13.8' 'overrides.jose=4.15.9' 'overrides.node-forge=1.4.0'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          python3 -c "import base64,zlib; from pathlib import Path; [print('WAD_METADATA_' + name + ':' + base64.b64encode(zlib.compress(Path(name).read_bytes())).decode()) for name in ('package.json','package-lock.json')]"
          npm audit --json > /tmp/wad-verification-audit.json || true
          python3 -c "import json; c=json.load(open('/tmp/wad-verification-audit.json')); print(json.dumps({'metadata': c.get('metadata'), 'vulnerabilities': c.get('vulnerabilities')}, indent=2))"
      - name: Install pinned dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Test API client and build application
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Collect actual unit coverage for analysis
        run: |
          mkdir -p .local/coverage
          cd backend
          go test -coverprofile=../.local/coverage/go.out ./...
          cd ../frontend
          npm ci --no-audit --no-fund
          cd ..
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=.local/coverage/lcov.info frontend/src/*.test.js
      - name: Run disposable private SonarQube analysis
        run: |
          sudo sysctl -w vm.max_map_count=1048576
          python3 scripts/sonar_ci.py
      - name: Save safe quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-analysis
          path: .local/sonar-evidence/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  production-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: wad-https-demo
      COMPOSE_FILE: compose.yaml:compose.https-demo.yaml
      POSTGRES_PORT: '5444'
      KEYCLOAK_PORT: '8445'
      API_ADDRESS: 127.0.0.1:8443
      OIDC_ISSUER: https://localhost:8444/realms/exams
      APP_ENV: development
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the standalone server and production frontend
        run: |
          mkdir -p .local/bin
          cd backend
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../.local/bin/exam-server ./cmd/server
          cd ../frontend
          npm ci --no-audit --no-fund
          npm run build
          npx --no-install playwright install --with-deps chromium
      - name: Prepare and trust isolated HTTPS certificates
        run: |
          python3 scripts/setup.py
          python3 scripts/prepare_https_demo.py
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3-tools
          sudo cp .local/https-demo/tls/ca.crt /usr/local/share/ca-certificates/wad-https-demo.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          if [ ! -f "$HOME/.pki/nssdb/cert9.db" ]; then certutil -N -d "sql:$HOME/.pki/nssdb" --empty-password; fi
          certutil -A -d "sql:$HOME/.pki/nssdb" -n wad-https-demo -t 'C,,' -i .local/https-demo/tls/ca.crt
          echo "SSL_CERT_FILE=$PWD/.local/https-demo/tls/ca.crt" >> "$GITHUB_ENV"
          echo "NODE_EXTRA_CA_CERTS=$PWD/.local/https-demo/tls/ca.crt" >> "$GITHUB_ENV"
          echo "TLS_CERT=$PWD/.local/https-demo/tls/server.crt" >> "$GITHUB_ENV"
          echo "TLS_KEY=$PWD/.local/https-demo/tls/server.key" >> "$GITHUB_ENV"
      - name: Bootstrap the isolated HTTPS identity and application databases
        run: |
          docker compose up -d --wait --wait-timeout 240
          python3 scripts/run.py migrate
          python3 scripts/run.py seed
          python3 scripts/run.py provision
      - name: Verify the compiled production process over trusted HTTPS
        working-directory: frontend
        env:
          APP_ENV: production
        run: npx --no-install playwright test -c playwright.production.config.js
      - name: Save public production verification metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: production-https-evidence
          path: .local/production-evidence/result.json
          include-hidden-files: true
          retention-days: 30
      - name: Stop isolated HTTPS services
        if: always() && hashFiles('.env') != ''
        run: docker compose down
