id: d1851470-6b61-4a18-88c9-a2756143fc0b
name: PUT /schedule/publication
description: Administrator with verified MFA. Publishing validates all current schedule rules and requires an invigilator for every allocation. Successful schedule changes unpublish automatically; rejected writes leave publication unchanged.
url: "{{base_url}}/api/v1/schedule/publication"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "published": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Private response', () => pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'));
    language: text/javascript
order: 10000
