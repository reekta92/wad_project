$kind: http-request
id: fae2e868-336e-4b54-a977-d02105eafe3b
name: GET /audit-logs/{id}
description: Administrator with verified MFA. Includes before/after values. A batch audit uses a null entity_id and snapshots of exams, rooms, and assignments.
url: "{{base_url}}/api/v1/audit-logs/{{audit_id}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Private response', () => pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'));
    language: text/javascript
order: 5000
