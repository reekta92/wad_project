$kind: http-request
id: 659d823a-62b9-4bf6-ac4b-76eccd1540e4
name: GET /reports/workload
description: Administrator with verified MFA. Includes personnel with zero duties; dates filter the duty count without removing zero-count rows.
url: "{{base_url}}/api/v1/reports/workload?page=1&page_size=20"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Private response', () => pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'));
      pm.test('Valid page metadata', () => { const value = pm.response.json(); pm.expect(value.data).to.be.an('array'); pm.expect(value.page).to.eql(1); pm.expect(value.page_size).to.eql(20); pm.expect(value.total).to.be.at.least(value.data.length); });
    language: text/javascript
order: 2000
