$kind: http-request
id: 14b18dc0-0fd1-4299-b66b-de8fa3c8f5d7
name: GET /reports/availability
description: Administrator with verified MFA. Eligibility for one additional duty, using the same unavailability, double-booking, daily, and consecutive-session rules as writes. An existing duty in the target session makes the person unavailable. Rows and rule state share a repeatable-read snapshot.
url: "{{base_url}}/api/v1/reports/availability?page=1&page_size=20"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Private response', () => pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'));
      pm.test('Valid page metadata', () => { const value = pm.response.json(); pm.expect(value.data).to.be.an('array'); pm.expect(value.page).to.eql(1); pm.expect(value.page_size).to.eql(20); pm.expect(value.total).to.be.at.least(value.data.length); });
    language: text/javascript
order: 3000
