$kind: http-request
id: 639c577a-52a5-4b3c-ab7a-223975bb41b4
name: GET /me/duties
description: Linked invigilator only. Personnel identity comes from the verified local account. Rows include the current assigned schedule, including unpublished duties; no other personnel duties are exposed.
url: "{{base_url}}/api/v1/me/duties?page=1&page_size=20"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Private response', () => pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'));
      pm.test('Valid page metadata', () => { const value = pm.response.json(); pm.expect(value.data).to.be.an('array'); pm.expect(value.page).to.eql(1); pm.expect(value.page_size).to.eql(20); pm.expect(value.total).to.be.at.least(value.data.length); });
    language: text/javascript
order: 1000
