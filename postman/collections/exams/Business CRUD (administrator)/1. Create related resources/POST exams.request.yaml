$kind: http-request
id: 0ebf070b-b39f-4722-90cd-ee63027a7786
url: "{{base_url}}/api/v1/exams"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "course_id": {{test_courses_id}},
      "session_id": {{test_sessions_id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.collectionVariables.set('test_exams_id', pm.response.json().id);
      pm.test('Created resource location', () => pm.expect(pm.response.headers.get('Location')).to.include('/' + pm.response.json().id));
      pm.collectionVariables.set('test_allocation_id', pm.response.json().rooms[0].id);
    language: text/javascript
order: 7000
