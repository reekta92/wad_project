$kind: http-request
id: 5d9e515d-405f-4887-95a3-ceebc5418cc1
url: "{{base_url}}/api/v1/classrooms"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Test room {{test_suffix}}",
      "capacity": 20,
      "type": "classroom",
      "floor": 27,
      "active": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.collectionVariables.set('test_classrooms_id', pm.response.json().id);
      pm.test('Created resource location', () => pm.expect(pm.response.headers.get('Location')).to.include('/' + pm.response.json().id));
    language: text/javascript
order: 3000
