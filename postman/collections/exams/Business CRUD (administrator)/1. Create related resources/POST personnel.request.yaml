$kind: http-request
id: 6b617436-f6b3-4e1d-9710-101ebaebeb03
url: "{{base_url}}/api/v1/personnel"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Dr.",
      "first_name": "Postman",
      "last_name": "Test",
      "department_id": {{test_departments_id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.collectionVariables.set('test_personnel_id', pm.response.json().id);
      pm.test('Created resource location', () => pm.expect(pm.response.headers.get('Location')).to.include('/' + pm.response.json().id));
    language: text/javascript
order: 5000
