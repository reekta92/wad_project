$kind: http-request
id: 05cf9106-ca55-40cb-b743-c66c8e1ceb38
url: "{{base_url}}/api/v1/courses"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "TEST{{test_suffix}}",
      "name": "Test course",
      "kind": "elective",
      "enrollment": 30,
      "term": 1,
      "department_id": {{test_departments_id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.collectionVariables.set('test_courses_id', pm.response.json().id);
      pm.test('Created resource location', () => pm.expect(pm.response.headers.get('Location')).to.include('/' + pm.response.json().id));
    language: text/javascript
order: 2000
