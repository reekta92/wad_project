$kind: http-request
id: 5c5c0833-f302-4437-be5c-93c9f4ba88ae
url: "{{base_url}}/api/v1/departments?page=1&page_size=20"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Filtered page metadata', () => { const body = pm.response.json(); pm.expect(body.data).to.be.an('array'); pm.expect(body.page).to.eql(1); pm.expect(body.page_size).to.eql(20); pm.expect(body.total).to.be.at.least(body.data.length); });
    language: text/javascript
order: 3000
