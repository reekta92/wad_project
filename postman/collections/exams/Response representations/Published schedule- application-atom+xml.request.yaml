$kind: http-request
id: 792a7802-32fa-4328-81b9-6e984e1917d4
name: "Published schedule: application/atom+xml"
url: "{{base_url}}/api/v1/schedule?page=1&page_size=20"
method: GET
headers:
  Accept: application/atom+xml
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Response media', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/atom+xml'));
      pm.test('Negotiated response', () => pm.expect(pm.response.headers.get('Vary')).to.include('Accept'));
    language: text/javascript
order: 3000
