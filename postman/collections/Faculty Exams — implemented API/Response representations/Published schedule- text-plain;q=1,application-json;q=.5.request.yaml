$kind: http-request
name: "Published schedule: text/plain;q=1,application/json;q=.5"
url: "{{base_url}}/api/v1/schedule?page=1&page_size=20"
method: GET
headers:
  Accept: text/plain;q=1,application/json;q=.5
queryParams:
  page: "1"
  page_size: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Response media', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/plain'));
      pm.test('Negotiated response', () => pm.expect(pm.response.headers.get('Vary')).to.include('Accept'));
    language: text/javascript
order: 2000
