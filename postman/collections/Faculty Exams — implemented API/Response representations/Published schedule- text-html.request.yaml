$kind: http-request
name: "Published schedule: text/html"
url: "{{base_url}}/api/v1/schedule?page=1&page_size=20"
method: GET
headers:
  Accept: text/html
queryParams:
  page: "1"
  page_size: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 406', () => pm.response.to.have.status(406));
      pm.test('Response media', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Negotiated response', () => pm.expect(pm.response.headers.get('Vary')).to.include('Accept'));
    language: text/javascript
order: 4000
