$kind: http-request
url: "{{base_url}}/api/v1/courses/{{test_courses_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "TEST{{test_suffix}}",
      "name": "Revised course",
      "kind": "elective",
      "enrollment": 30,
      "term": 1,
      "department_id": {{test_departments_id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
    language: text/javascript
order: 5000
