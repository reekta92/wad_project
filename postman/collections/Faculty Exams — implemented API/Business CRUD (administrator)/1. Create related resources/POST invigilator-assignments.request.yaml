$kind: http-request
url: "{{base_url}}/api/v1/invigilator-assignments"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": {{test_allocation_id}},
      "personnel_id": {{test_personnel_id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.collectionVariables.set('test_invigilator_assignments_id', pm.response.json().id);
      pm.test('Created resource location', () => pm.expect(pm.response.headers.get('Location')).to.include('/' + pm.response.json().id));
    language: text/javascript
order: 8000
