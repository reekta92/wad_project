$kind: http-request
name: GET /schedule/export
url: "{{base_url}}/api/v1/schedule/export"
method: GET
headers:
  Accept: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Binary response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'));
      pm.test('Private attachment', () => { pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'); pm.expect(pm.response.headers.get('Content-Disposition')).to.include('attachment'); });
    language: text/javascript
order: 1000
