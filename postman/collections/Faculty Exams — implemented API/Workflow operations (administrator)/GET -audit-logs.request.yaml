$kind: http-request
name: GET /audit-logs
description: Administrator with verified MFA. Append-only audit reads; date bounds are inclusive UTC days. SQL filtering/paging retains accurate totals on empty pages.
url: "{{base_url}}/api/v1/audit-logs?page=1&page_size=20"
method: GET
headers:
  Accept: application/json
queryParams:
  page: "1"
  page_size: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Private response', () => pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'));
      pm.test('Valid page metadata', () => { const value = pm.response.json(); pm.expect(value.data).to.be.an('array'); pm.expect(value.page).to.eql(1); pm.expect(value.page_size).to.eql(20); pm.expect(value.total).to.be.at.least(value.data.length); });
      if (pm.response.json().data.length) pm.collectionVariables.set('audit_id', pm.response.json().data[0].id);
    language: text/javascript
order: 4000
