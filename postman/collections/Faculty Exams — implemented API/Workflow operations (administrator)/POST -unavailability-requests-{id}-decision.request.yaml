$kind: http-request
name: POST /unavailability-requests/{id}/decision
description: Administrator with verified MFA. Decides a pending request exactly once, validates duty conflicts, records the actor/time, and audits atomically. A conflict leaves the request pending.
url: "{{base_url}}/api/v1/unavailability-requests/{{decision_request_id}}/decision"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "approved": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Private response', () => pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'));
    language: text/javascript
order: 6000
