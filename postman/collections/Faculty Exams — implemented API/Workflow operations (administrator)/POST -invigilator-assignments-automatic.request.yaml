$kind: http-request
name: POST /invigilator-assignments/automatic
description: Administrator with verified MFA. Processes allocation IDs ascending, preferring eligible department staff, then lowest total duty count, then personnel ID. Existing duties remain. Entire batch, audit, and publication invalidation commit together; failure leaves no partial staffing.
url: "{{base_url}}/api/v1/invigilator-assignments/automatic"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "scope": "all"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Private response', () => pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'));
      pm.test('Batch result matches committed IDs', () => { const value = pm.response.json(); pm.expect(value.count).to.eql(value.ids.length); });
    language: text/javascript
order: 9000
