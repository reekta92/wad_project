$kind: http-request
name: GET /dashboard
description: Administrator with verified MFA. Counts and bounded previews are returned from one SQL snapshot.
url: "{{base_url}}/api/v1/dashboard"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Private response', () => pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'));
      pm.test('Bounded dashboard previews', () => Object.values(pm.response.json().previews).forEach(rows => pm.expect(rows.length).to.be.at.most(5)));
    language: text/javascript
order: 1000
