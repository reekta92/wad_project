$kind: http-request
name: POST /schedule/automatic-planning
description: Administrator with verified MFA. Preserves existing exams. Tries unscheduled course IDs ascending, then date/start-time/session-ID ascending. Reuses room selection and scheduling rules. Entire batch rolls back if a target cannot be placed; the deterministic heuristic does not claim global infeasibility. A no-op preserves publication.
url: "{{base_url}}/api/v1/schedule/automatic-planning"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "season": "all"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Private response', () => pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'));
      pm.test('Batch result matches committed IDs', () => { const value = pm.response.json(); pm.expect(value.count).to.eql(value.ids.length); });
    language: text/javascript
order: 8000
